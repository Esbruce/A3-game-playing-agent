<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A3 K-in-a-Row To-Do</title><style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--card:#f6f8fa;--bd:#d0d7de;--ac:#2da44e;--c:#cf222e;--r:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--card:#161b22;--bd:#30363d;--ac:#3fb950;--c:#ff7b72;--r:#d29922}}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px}.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}.ctl{margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer}button.on{border-color:var(--ac);color:var(--ac)}
section{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:12px 0;padding:8px 14px}
h2{font-size:16px;display:flex;justify-content:space-between;gap:8px;margin:6px 0}h2 small{color:var(--mut);font-weight:400}
label{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--bd);cursor:pointer}input{margin-top:5px;accent-color:var(--ac)}
label.done span.t{text-decoration:line-through;color:var(--mut)}.tag{font-size:11px;border-radius:10px;padding:0 7px;height:18px;margin-top:3px;white-space:nowrap;border:1px solid}
.compulsory{color:var(--c)}.recommended{color:var(--r)}.note{color:var(--mut);font-size:13px}
</style></head><body><div class="top"><h1>A3 K-in-a-Row To-Do</h1><div class="bar"><i id="b"></i></div><div id="s" class="note"></div>
<div class="ctl"><button data-f="all" class="on">All</button><button data-f="compulsory">Compulsory</button><button data-f="recommended">Recommended</button><button data-f="open">Not done</button><button id="rs">Reset</button></div></div><div id="app"></div>
<script>const P=[{"title": "Phase 0 \u2014 Admin and housekeeping", "intro": [], "items": [{"tag": "compulsory", "text": "Fill in the planning questionnaire (1 participation point)."}, {"tag": "compulsory", "text": "Decide on a partner, or confirm you are working solo. Put both names and IDs in `AUTHORS` and `STUDENT_IDS`."}, {"tag": "compulsory", "text": "Fix the ID mismatch. The file is `eschbru_KInARow.py` but `STUDENT_IDS = ['eschubru']` and the docstring says `eschubru`. The first ID must match the file name exactly."}, {"tag": "compulsory", "text": "Decide what to do with `yourID_KInARow.py`. Revert or delete it so it can't be submitted by mistake."}, {"tag": "compulsory", "text": "Read `game_types.py`, `agent_base.py` and `RandomPlayer.py`. Note where `k` lives (the `Game_Type`), what `' '`, `'-'`, `'X'` and `'O'` mean, the three playing modes, and the move order `RandomPlayer` generates."}, {"tag": "compulsory", "text": "Point `Game_Master_Offline.py` at your agent vs `RandomPlayer`, and set `AGENT_FILE` in `autograder.py` to `eschbru_KInARow`."}, {"tag": "recommended", "text": "Commit the working tree, then commit after each phase below."}]}, {"title": "Phase 1 \u2014 Fix bugs in the current code (Part I foundations)", "intro": [], "items": [{"tag": "compulsory", "text": "**`prepare()` is broken.** It contains a nested `def __init__(self)`, so nothing is saved and it never returns. Remove the nested def. Save `self.current_game_type`, `self.who_i_play`, `self.opponent_nickname` and `self.playing` at the top level of `prepare`, and `return \"OK\"` (exact string, upper-case \u2014 the code currently has `\"Ok\"`, inside the nested function)."}, {"tag": "compulsory", "text": "**`make_move()` returns early.** The draw check on `blank_square_count == 0` is inside the loop over successors. Move it outside the loop, or drop it. The brief guarantees a legal move exists."}, {"tag": "compulsory", "text": "**Choose the best move by the side you are playing.** The code uses the mover in `current_state`, which is fine, but make sure that X maximizes and O minimizes everywhere."}, {"tag": "compulsory", "text": "**Call `minimax` from `make_move` properly.** It should take the root call's `[score, move, state]` instead of re-implementing the root loop. Pass `max_ply` through and respect it exactly in AUTOGRADER mode."}, {"tag": "compulsory", "text": "**Terminal states.** Detect a win (k in a row) in `static_eval`/`minimax` and return a very large value (\u00b11e6 or similar). Without this the agent won't reliably take a win or block a loss. Use `winTesterForK.py` to help."}, {"tag": "compulsory", "text": "**Don't return the input state.** Always deep-copy with `State(old=...)`."}, {"tag": "compulsory", "text": "**Move order.** In AUTOGRADER mode, generate moves in the same order as `RandomPlayer` (check its loops). Otherwise the cutoff counts won't match."}, {"tag": "compulsory", "text": "**Use `special_static_eval_fn`.** When it is provided (AUTOGRADER mode), use it in place of your own `static_eval`."}, {"tag": "compulsory", "text": "**Return format.** DEMO and COMPETITION return `[[move, state], utterance]`. AUTOGRADER returns `[[move, state, stats], utterance]`. The stats dict must contain all six keys from `agent_base.py`, including `zobrist_num_useful_hits_for_minimax` and `zobrist_num_useful_hits_for_ordering`. Your code currently returns `None` for stats."}, {"tag": "compulsory", "text": "**Handle `None` for `alpha`, `beta` and `pruning`.** `pruning=False` must ignore alpha and beta."}, {"tag": "compulsory", "text": "**Utterance must be non-empty** (at least one word) on every return path."}, {"tag": "compulsory", "text": "Make `minimax` return a float value plus a move. Fix the `float('-inf')` start so a child is always selected."}]}, {"title": "Phase 2 \u2014 Core search and stats (Part I, 20 pts)", "intro": [], "items": [{"tag": "compulsory", "text": "Reset the per-turn counters at the start of each `make_move`: `num_static_evals_this_turn`, `alpha_beta_cutoffs_this_turn`, and the zobrist counters (default -1 if not implemented)."}, {"tag": "compulsory", "text": "Increment `num_static_evals_this_turn` on every static eval call. Increment `alpha_beta_cutoffs_this_turn` on every `break`."}, {"tag": "compulsory", "text": "Make sure the alpha-beta cutoff condition is correct and that the same value is returned with and without pruning."}, {"tag": "compulsory", "text": "**Time management.** Use `time_limit` and `expected_time_per_move` from `prepare`. Demo moves should take under 3 s; competition has tight limits. Do iterative deepening or a deadline check inside `minimax`, and return the best move found so far."}, {"tag": "compulsory", "text": "**Handle forbidden squares (`'-'`) and handicap starts.** Moves are generated only on `' '`."}, {"tag": "compulsory", "text": "Run `python autograder.py` and fix everything until every check passes (load, prepare/introduce, full game, static-eval ordering, minimax, alpha-beta)."}]}, {"title": "Phase 3 \u2014 Static evaluation (the key to winning the tournament)", "intro": [], "items": [{"tag": "compulsory", "text": "Review the current `static_eval`. It scores each k-window as x/k and gives the same linear weight to every count. Make it non-trivial and rank clearly different positions correctly, since the autograder checks ordering on human-obvious states."}, {"tag": "compulsory", "text": "Weight lines **non-linearly** in the number of tokens, for example `10**count`. A window with k-1 of your tokens and no blocker should score hugely more than two windows with one token each."}, {"tag": "compulsory", "text": "Treat lines containing both X and O as dead (done), and windows containing `'-'` as dead (done). Make sure windows that cross the board edge are skipped (done)."}, {"tag": "compulsory", "text": "Remove unused work. The `data` dict is built and then only summed. A single pass is faster. Speed matters in the tournament."}, {"tag": "recommended", "text": "Add features: open vs half-open lines, double threats (two windows each needing one more token), and a bonus for the side to move. A centre or mobility bonus is optional."}, {"tag": "recommended", "text": "Use the board size and `k` to scale things. A 10\u00d715 board with k=9 behaves very differently from 3\u00d73."}, {"tag": "recommended", "text": "Tune the weights by playing your agent against `RandomPlayer` and against earlier versions of itself."}, {"tag": "recommended", "text": "Benchmark `static_eval` speed and optimise it, perhaps with precomputed window lists per game type built in `prepare`."}]}, {"title": "Phase 4 \u2014 Extra credit, Part I (recommended)", "intro": [], "items": [{"tag": "recommended", "text": "**EC A: child ordering by static eval.** Sort successors by `static_eval` (descending for X, ascending for O) before recursing. Don't do this in AUTOGRADER mode if it breaks the required move order. Measure the cutoff and eval-count benefit against the default ordering at a fixed depth (e.g. 4 ply). Record the numbers for Section 11 of the diary."}, {"tag": "recommended", "text": "**EC B: Zobrist hashing.** Build random bitstrings per (square, piece), hash the board incrementally, and keep a transposition table storing value, depth and best move. Instrument writes, read attempts and hits, plus the two \"useful hits\" counters, and fill the stats dict. Honour `use_zobrist_hashing` (on/off). Optionally reuse stored values to order children. Measure the benefit and record it for Section 11."}, {"tag": "recommended", "text": "If you skip Zobrist, leave the stats at -1 and ignore the flag."}, {"tag": "recommended", "text": "Re-run `autograder.py` after each of these to confirm nothing broke."}]}, {"title": "Phase 5 \u2014 Persona and dialog (Part II, 20 pts)", "intro": [], "items": [{"tag": "compulsory", "text": "Finalise the persona. Ali G is fun, but fix the `introduce()` text so it includes **the agent's name, your real name(s) and student ID(s)**, as the brief requires. Check the twin variant."}, {"tag": "compulsory", "text": "Remove the `'bland'` persona label and make `self.persona` match Ali G."}, {"tag": "compulsory", "text": "Keep the intro appropriate for a graded transcript."}, {"tag": "compulsory", "text": "Write rule-based utterances that depend on the game state: opening move, taking a win, blocking a threat, a winning or losing position (from the static eval), a draw, and a long game."}, {"tag": "compulsory", "text": "Reference search stats in some lines (static evals, cutoffs, depth) so they teach something about the technology."}, {"tag": "compulsory", "text": "React to `current_remark` from the opponent: greet back, acknowledge, answer questions, and avoid repeating yourself. Track past utterances and a repeat counter."}, {"tag": "compulsory", "text": "In COMPETITION mode (`utterances_matter=False`), return a short, cheap utterance and import nothing extra."}, {"tag": "recommended", "text": "Use varied template pools with random choice, and the `voice_info` field for voice quality."}, {"tag": "recommended", "text": "**EC: LLM utterances.** Import the LLM SDK only in `prepare`, only if the mode is DEMO and `utterances_matter` is true. Wrap the import **and every call** in try/except with a fallback to your rule-based lines. Craft a persona prompt that includes board state, last move and evaluation. Decide whether to hard-code an API key, which has security implications \u2014 see below \u2014 or submit two extra transcripts against different opponents."}, {"tag": "recommended", "text": "**EC: \"Tell me how you did that.\"** If the opponent's remark contains this, answer with real stats from the last move: states evaluated, time spent, cutoffs, depth, and Zobrist figures if used. Capture an example for Section 11."}, {"tag": "recommended", "text": "**EC: \"What's your take on the game so far?\"** Keep the history of states and utterances. Tell a short story of the game and predict the winner from the current static eval. Capture an example for Section 11."}]}, {"title": "Phase 6 \u2014 Testing and polish", "intro": [], "items": [{"tag": "compulsory", "text": "Play many games against `RandomPlayer` as both X and O, on 3\u00d73, 5-in-a-row on 7\u00d77 with corners forbidden, and Cassini, which has pre-placed Os. Make sure the agent never crashes or times out."}, {"tag": "compulsory", "text": "Test the twin, both agents being the same class, to make sure instance state doesn't clash."}, {"tag": "compulsory", "text": "Run `python autograder.py` one final time and confirm a full score."}, {"tag": "compulsory", "text": "Confirm no non-standard-library imports at module level (competition mode requires the standard Python distribution only)."}, {"tag": "recommended", "text": "Test timing at low `expected_time_per_move` values to prepare for tournament time-limit rounds."}, {"tag": "recommended", "text": "Play against a classmate's agent early so you have a real opponent for the transcript."}]}, {"title": "Phase 7 \u2014 Transcript (10 pts)", "intro": [], "items": [{"tag": "compulsory", "text": "Get an opponent's agent file (a person or partnership in the class). It must not be your own agent and must not be a starter-code agent."}, {"tag": "compulsory", "text": "In `Game_Master_Offline.py`, import both agents, set the game type to **Five-in-a-Row on Seven-by-Seven Board with Corners Forbidden**, and keep `USE_HTML = True`."}, {"tag": "compulsory", "text": "Run the game and open the generated `.html` file to check that it looks right and the utterances read well."}, {"tag": "compulsory", "text": "Convert the HTML to `GameTranscript.pdf` (browser print to PDF via `python -m http.server 5000`, or pandoc)."}, {"tag": "recommended", "text": "Keep the `.json` transcript too, since the instructor may ask for it."}, {"tag": "recommended", "text": "If you use an LLM and don't hard-code a key, produce a second transcript against a different opponent."}]}, {"title": "Phase 8 \u2014 Learning Diary (`Learning-Diary-Entry.pdf`, 60 pts)", "intro": ["Start from `Learning-Diary-Template.html`. Do this alongside Phases 3\u20137 so the real numbers and examples are captured while you work."], "items": [{"tag": "compulsory", "text": "Agent design goals and persona, and how the twin differs from the base agent."}, {"tag": "compulsory", "text": "Alpha-beta analysis: a hands-on leaf-count measurement (with vs without pruning at a fixed depth) and a conceptual explanation of why pruning is correct."}, {"tag": "compulsory", "text": "Static eval design, with a worked example from a real game run."}, {"tag": "compulsory", "text": "Dialog and utterance design: explain how it works."}, {"tag": "compulsory", "text": "Challenges and solutions."}, {"tag": "compulsory", "text": "Gen-AI tool use and attribution. State honestly where AI helped."}, {"tag": "compulsory", "text": "Section 11 (Extra Credit): list each extra-credit item completed, with measurements or examples. Write \"none\" if there are none."}, {"tag": "compulsory", "text": "Export to PDF and read through for typos."}]}, {"title": "Phase 9 \u2014 Submission", "intro": [], "items": [{"tag": "compulsory", "text": "Submit: `eschbru_KInARow.py`, `GameTranscript.pdf`, `Learning-Diary-Entry.pdf`."}, {"tag": "compulsory", "text": "Re-run the submitted file from a clean folder with the starter files, to confirm it loads."}, {"tag": "compulsory", "text": "Remove any hard-coded API keys you don't want shared. If you do hard-code one for the staff, use a restricted, low-quota key."}, {"tag": "recommended", "text": "Add any extra transcripts for dialog extra credit or the competition."}]}, {"title": "Phase 10 \u2014 Tournament (recommended, extra credit)", "intro": [], "items": [{"tag": "recommended", "text": "Top 50% of agents earns 5 points. Top 5 earns another 5. Best at play earns 5. One of the five best in dialog earns 5."}, {"tag": "recommended", "text": "Priorities for tournament strength: fast static eval, iterative deepening with a safe time margin, strong threat detection (win, block, double threat), and Zobrist plus move ordering to search deeper."}, {"tag": "recommended", "text": "Leave a safety margin on time. Rounds may be repeated with shorter limits when there are many ties."}]}];let f="all",st={};try{st=JSON.parse(localStorage.getItem("a3todo")||"{}")}catch(e){}
function save(){try{localStorage.setItem("a3todo",JSON.stringify(st))}catch(e){}}
function render(){const app=document.getElementById("app");app.innerHTML="";let tot=0,dn=0;
P.forEach((p,pi)=>{const sec=document.createElement("section");let d=0,n=0;
p.items.forEach((it,i)=>{n++;if(st[pi+"."+i])d++});tot+=n;dn+=d;
sec.innerHTML="<h2>"+p.title+"<small>"+d+"/"+n+"</small></h2>"+p.intro.map(x=>'<div class=note>'+x+'</div>').join("");
p.items.forEach((it,i)=>{const k=pi+"."+i,c=!!st[k];if(f=="compulsory"&&it.tag!=f||f=="recommended"&&it.tag!=f||f=="open"&&c)return;
const l=document.createElement("label");l.className=c?"done":"";
l.innerHTML='<input type=checkbox '+(c?"checked":"")+'><span class=t></span>'+(it.tag?'<span class="tag '+it.tag+'">'+it.tag+'</span>':"");
l.querySelector(".t").textContent=it.text.replace(/\*\*/g,"").replace(/`/g,"");
l.querySelector("input").onchange=e=>{st[k]=e.target.checked;save();render()};sec.appendChild(l)});
if(sec.querySelector("label"))app.appendChild(sec)});
document.getElementById("b").style.width=(tot?100*dn/tot:0)+"%";document.getElementById("s").textContent=dn+" of "+tot+" done"}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x==b));render()});
document.getElementById("rs").onclick=()=>{if(confirm("Clear all ticks?")){st={};save();render()}};render()</script></body></html>
